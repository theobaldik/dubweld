name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync

      - run: uv run pytest
